<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal - Enterprise Ticketing System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var path = window.location.pathname;
        var repoMatch = path.match(/^(\/[^\/]+)(\/.*)$/);
        if (repoMatch && repoMatch[2] && repoMatch[2] !== '/' && !window.location.hash) {
          window.location.replace(repoMatch[1] + '/#' + repoMatch[2] + window.location.search);
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#111827] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
