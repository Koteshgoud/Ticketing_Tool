[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "platform-backend"
version = "0.1.0"
description = "Platform API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # ── Validation / settings ────────────────────────────
    "pydantic[email]>=2.7.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.3.0",
    # ── Database ─────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # ── Cache / queue ────────────────────────────────────
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    # ── Auth / JWT ───────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    # ── File storage ─────────────────────────────────────
    "aioboto3>=13.0.0",
    # ── Observability ────────────────────────────────────
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "sentry-sdk[fastapi]>=2.5.0",
    "structlog>=24.2.0",
    # ── Utilities ────────────────────────────────────────
    "python-multipart>=0.0.9",
    "tenacity>=8.3.0",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
