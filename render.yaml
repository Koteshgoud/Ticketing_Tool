services:
  - type: web
    name: ticketing-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "sh -c \"if [ -d 'backend' ]; then cd backend; fi && pip install --upgrade pip && pip install -r requirements.txt\""
    startCommand: "sh -c \"if [ -d 'backend' ]; then cd backend; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT\""
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: APP_ENV
