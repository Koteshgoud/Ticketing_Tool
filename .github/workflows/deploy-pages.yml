name: Deploy Ticketing System to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install portal dependencies
        run: |
          echo "Installing Employee portal dependencies..."
          cd frontend/employee && npm ci || npm install
          echo "Installing Team Lead portal dependencies..."
          cd ../teamlead && npm ci || npm install
          echo "Installing Admin portal dependencies..."
          cd ../admin && npm ci || npm install

      - name: Build production bundle
        working-directory: frontend/admin
        run: npx vite build

      - name: Configure SPA routing and disable Jekyll
        run: |
          cp frontend/admin/dist/index.html frontend/admin/dist/404.html
          touch frontend/admin/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/admin/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
